# Build and open the Shadcn dashboard at http://localhost:8501
#   docker compose up --build
#
# Run a scan with the same config.yaml. The scan image does not include the UI.
#   docker compose --profile scan run --rm scan
#   docker compose --profile scan run --rm scan --universe INTC,XOM,NEM --limit 3

services:
  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      FMP_API_KEY: ${FMP_API_KEY:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_PASSWORD: ${ALERT_EMAIL_PASSWORD:-}
      ALERT_EMAIL_USER: ${ALERT_EMAIL_USER:-}
    restart: unless-stopped

  scan:
    build:
      context: .
      target: runtime
    profiles: ["scan"]
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      FMP_API_KEY: ${FMP_API_KEY:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_PASSWORD: ${ALERT_EMAIL_PASSWORD:-}
      ALERT_EMAIL_USER: ${ALERT_EMAIL_USER:-}
    entrypoint: ["python", "-m", "src.main"]
    command: []
